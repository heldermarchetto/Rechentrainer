<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<title>Rechentrainer (Klasse 5–9)</title>
<style>
:root{--bg:#f4f6fb;--ink:#1d2433;--muted:#5b6475;--accent:#f2b705;--accent2:#2563eb;--ok:#16a34a;--bad:#dc2626;--line:#dde3ee}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
.top{position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.08)}
header{background:#1d2433;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;gap:10px;flex-wrap:wrap}
header h1{font-size:20px;margin:0}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;white-space:nowrap;background:var(--accent);color:#1d2433}
.hbtn{background:#334155;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:15px;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px 18px;background:#fff;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;font-size:16px;cursor:pointer;color:var(--ink)}
.tab.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
main{max-width:1100px;margin:0 auto;padding:18px}
.page{display:none}.page.active{display:block}
h2{margin:6px 0 14px;font-size:27px}h3{margin:4px 0 10px;font-size:21px}
.card{background:#fff;border-radius:16px;padding:18px 22px;margin:0 0 18px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.note{background:#f0fdf4;border-left:5px solid var(--ok);padding:10px 14px;border-radius:8px;margin:10px 0}
.warn{background:#fff7ed;border-left:5px solid #f97316;padding:10px 14px;border-radius:8px;margin:10px 0}
.en{color:var(--muted);font-style:italic}
.btn{background:var(--accent2);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:17px;cursor:pointer;font-weight:600}
.btn.sec{background:#e5e9f2;color:var(--ink)}.btn.green{background:var(--ok)}.btn.yellow{background:var(--accent);color:#1d2433}
.btn.big{font-size:24px;padding:14px 34px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
input[type=text]{font-size:18px;padding:7px 10px;border:2px solid var(--line);border-radius:10px;font-family:inherit;color:var(--ink);background:#fff}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:12px 20px;border-radius:12px;z-index:200;font-size:17px;max-width:90%}
/* Bereiche */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0 14px}
.acard{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.acard:hover{border-color:var(--accent2)}
.acard.sel{border-color:var(--accent2);background:#eef4ff;box-shadow:0 0 0 2px #bfd3fb}
.acard .ai{font-size:26px}.acard .an{font-weight:700;font-size:18px}.acard .ak{font-size:14px;color:var(--muted)}
.acard .ab{font-size:13.5px;color:#166534;margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 13px;font-size:16.5px;cursor:pointer;color:var(--ink);text-align:left}
.opt.sel{background:#dbeafe;border-color:var(--accent2)}
.opt small{display:block;color:var(--muted);font-size:13.5px}
.lblh{font-weight:700;margin:12px 0 6px}
.steps{background:#f6f8fc;border-radius:12px;padding:10px 14px 10px 34px;margin:8px 0}

.runbar{position:sticky;top:96px;z-index:40;background:#1e293b;color:#fff;border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.runbar .clk{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.runbar .clk.cw{color:#fcd34d}.runbar .clk.co{color:#fca5a5}
.runbar .info{font-size:15.5px;color:#cbd5e1}
.runbar .grow{flex:1}
.timenote{display:none;margin:-6px 0 12px;background:#fff1dc;border-left:4px solid #f59e0b;border-radius:8px;padding:8px 12px;font-size:16px}
.timenote.show{display:block}.timenote.over{background:#fde2e2;border-color:#dc2626}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;align-items:start}
.tgrid.wide{grid-template-columns:repeat(auto-fill,minmax(480px,1fr))}
.task{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;position:relative}
.task .tn{position:absolute;top:6px;right:10px;font-size:13px;color:var(--muted)}
.task .tq{font-size:21px;margin:2px 0 6px;line-height:1.6}
.task .tl{font-size:14.5px;color:var(--muted)}
.task input{width:100%;font-size:20px}
.task.ok{border-color:#86efac;background:#f0fdf4}.task.bad{border-color:#fca5a5;background:#fff5f5}.task.fixed{border-color:#86efac;background:#f7fdf9}.task.shown{border-color:#fcd34d;background:#fffbeb}
.task .res{font-size:15.5px;margin-top:6px}
.task .tip{margin-top:6px;background:#fff8e1;border-radius:8px;padding:6px 10px;font-size:15.5px}
.task .prev{font-size:17px;color:#1e40af;min-height:24px;margin-top:3px}
.task .ttime{font-size:12.5px;color:var(--muted)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
sup{font-size:.7em}
.score{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.score .big{font-size:40px;font-weight:800}
.bar{height:14px;border-radius:8px;background:#e5e9f2;overflow:hidden;flex:1 1 200px}.bar i{display:block;height:100%;background:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}th{background:#f1f4fa}
/* Tastenfeld für Terme */
.kpad{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#1e293b;padding:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;box-shadow:0 -4px 12px rgba(0,0,0,.2)}
.kpad button{min-width:52px;font-size:22px;padding:8px 10px;border:0;border-radius:10px;background:#475569;color:#fff;cursor:pointer}
.kpad button.v{background:#2563eb}.kpad .kh{color:#cbd5e1;font-size:14px;align-self:center;margin-right:6px}
/* online speichern */
.cstat{font-size:14px;font-weight:700;padding:5px 10px;border-radius:10px;background:#334155;color:#e2e8f0;white-space:nowrap}
.cstat:empty{display:none}
.cstat.ok{color:#86efac}.cstat.busy,.cstat.foto{color:#fde68a}.cstat.off{color:#fca5a5}
.fs-ov{position:fixed;inset:0;background:rgba(15,23,42,.75);display:flex;align-items:flex-start;justify-content:center;z-index:400;padding:40px 16px;overflow:auto}
.fs-box{background:#fff;border-radius:20px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.fs-box h2{margin:.1em 0 .3em;font-size:27px}
.fs-sub{font-size:15px;color:var(--muted);font-weight:400}
.fs-box label{display:block;font-weight:700;margin:12px 0 4px}
.fs-box input{font:inherit;font-size:22px;width:100%;border:2px solid #cbd5e1;border-radius:12px;padding:10px 12px}
.fs-box .go{margin-top:16px;width:100%;font-size:20px;padding:12px;border-radius:12px;border:0;background:var(--ok);color:#fff;font-weight:800;cursor:pointer}
.fs-msg{margin-top:12px;font-weight:600;border-radius:10px;padding:8px 10px;display:none;font-size:16px}
.fs-msg.bad{display:block;background:#fee2e2;color:#9b1c1c}.fs-msg.info{display:block;background:#eef2ff;color:#3730a3}

.dfu{text-decoration:underline dotted #2563eb 2px;text-underline-offset:3px;cursor:help}
body.dfu-off .dfu{text-decoration:none;cursor:inherit}
.dfu-demo{text-decoration:underline dotted #2563eb 2px;text-underline-offset:3px}
.dfu-pop{position:fixed;z-index:260;background:#1e293b;color:#fff;border-radius:12px;padding:10px 14px;max-width:min(360px,92vw);font-size:17px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.dfu-pop .dp-pl{color:#cbd5e1;font-size:15px}.dfu-pop .dp-en{font-size:18px;margin-top:2px}.dfu-pop .dp-x{font-size:15px;color:#e2e8f0;margin-top:4px}
.dfu-pop .dp-row{display:flex;gap:6px;margin-top:8px}.dfu-pop button{background:#334155;color:#fff;border:0;border-radius:8px;padding:5px 10px;font-size:14.5px;cursor:pointer}
.dfu-pop .ar-der{color:#93c5fd}.dfu-pop .ar-die{color:#fca5a5}.dfu-pop .ar-das{color:#86efac}
.ar-der{color:#1d4ed8;font-weight:700}.ar-die{color:#b91c1c;font-weight:700}.ar-das{color:#15803d;font-weight:700}
.w-leg{font-size:16px}.w-note{font-size:15px;color:var(--muted)}.w-stat{margin:4px 0 10px}
.w-prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.w-bar{flex:1 1 200px;height:12px;background:#e5e9f2;border-radius:8px;overflow:hidden;margin:6px 0}.w-bar i{display:block;height:100%;background:var(--ok)}
.w-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.wchip{border:2px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.wchip.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.witem{display:grid;grid-template-columns:40px 1fr 26px;grid-template-rows:auto auto;column-gap:8px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.witem.ok{border-color:#86efac;background:#f0fdf4}
.witem .wsay{grid-row:1/3;border:0;background:#eef4ff;border-radius:8px;font-size:18px;height:36px;cursor:pointer}
.witem .wde{font-size:17px}.witem .wpl{color:var(--muted);font-size:14px;margin-left:6px}.witem .wx{display:block;color:var(--muted);font-size:14px}
.witem .wen{grid-column:2;color:var(--muted);font-style:italic;font-size:15.5px}.witem .wmk{grid-column:3;grid-row:1/3;text-align:center}
.tcard .tq{font-size:19px;margin:12px 0}.tq-big{font-size:26px;font-weight:700;margin:6px 0}.tq-en{font-style:italic;color:#1e40af}
.tops .opt{min-width:150px}
.opt.right{background:#dcfce7;border-color:var(--ok)}.opt.wrong{background:#fee2e2;border-color:var(--bad)}
.fb{margin-top:6px;font-size:16.5px}.fb.ok{color:#15803d}.fb.no{color:#b91c1c}
@media (max-width:700px){.runbar{top:120px}.tgrid.wide{grid-template-columns:1fr}}

.sq{white-space:nowrap}.sq>span{border-top:2px solid currentColor;padding:0 3px;margin-left:1px}.sq .ri{font-size:.55em;margin-right:-4px;vertical-align:super}
.gap{display:inline-block;min-width:46px;border-bottom:2px dashed #94a3b8;text-align:center;color:#94a3b8}
.kpad.np{gap:8px}.kpad.np button{min-width:74px;font-size:28px;padding:10px 0}.kpad.np button.go{background:var(--ok);min-width:110px}
.nvb{white-space:nowrap;font-size:15px;padding:7px 10px}
.acard .ai{font-weight:700}
</style>

(function (global) {

const KEY = 'GSIS-Rechentrainer-2026';

const te = new TextEncoder(), td = new TextDecoder();

function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

async function encrypt(app, obj) { return encode(app, obj); }

function download(blob, name) {

class MiniPDF {
  constructor() { this.W = 595.28; this.H = 841.89; this.pages = []; this.images = []; this.addPage(); }
  /* JPEG (dataURL) einbetten; w,h = Pixelgröße. Gibt Namen zurück. */

    if (o.fill) s += `${rgb(o.fill)} rg `; if (o.stroke) s += `${rgb(o.stroke)} RG `;

    objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

/* Fließtext-Layout mit automatischem Seitenumbruch */
class FlowPDF extends MiniPDF {
  constructor(footer) { super(); this.m = 42; this.y = this.m; this.footer = footer || ''; }
  get cw() { return this.W - 2 * this.m; }
  ensure(h) { if (this.y + h > this.H - this.m - 18) { this.addPage(); this.y = this.m; } }
  gap(h) { this.y += h; }
  h1(t) { this.ensure(40); this.rect(this.m, this.y, this.cw, 30, { fill: [29, 36, 51] }); this.text(this.m + 10, this.y + 20, t, { size: 15, bold: true, color: [255, 255, 255] }); this.y += 40; }
  h2(t) { this.ensure(34); this.y += 6; this.text(this.m, this.y + 12, t, { size: 12.5, bold: true, color: [30, 64, 175] }); this.line(this.m, this.y + 17, this.m + this.cw, this.y + 17, { color: [242, 183, 5], w: 1.2 }); this.y += 26; }
  para(t, o) {
    o = o || {}; const size = o.size || 10, lh = size * 1.35, ind = o.indent || 0;
    const lines = this.wrap(t, this.cw - ind, size, o.bold);
    lines.forEach(l => { this.ensure(lh); this.text(this.m + ind, this.y + size, l, { size, bold: o.bold, color: o.color }); this.y += lh; });
    this.y += o.after === undefined ? 4 : o.after;
  }
  box(t, o) { // umrandeter Textkasten (z.B. Schülertext)
    o = o || {}; const size = o.size || 10, lh = size * 1.35;
    const lines = this.wrap(t || '(keine Antwort)', this.cw - 16, size);
    let i = 0;
    while (i < lines.length) {
      this.ensure(lh + 12);
      const room = Math.max(1, Math.floor((this.H - this.m - 18 - this.y - 12) / lh));
      const part = lines.slice(i, i + room);
      const h = part.length * lh + 10;
      this.rect(this.m, this.y, this.cw, h, { fill: o.fill || [246, 248, 252], stroke: [210, 216, 228] });
      part.forEach((l, k) => this.text(this.m + 8, this.y + 5 + size + k * lh, l, { size, color: t ? [0, 0, 0] : [140, 140, 140] }));
      this.y += h + 6; i += part.length;
    }
  }
  /* cols: [{w (Anteil), label, align}], rows: [[cell]], cell: string | {t, fill, bold, color} */
  table(cols, rows, o) {
    o = o || {}; const size = o.size || 9, lh = size * 1.3, pad = 4;
    const tot = cols.reduce((a, c) => a + c.w, 0); const ws = cols.map(c => c.w / tot * this.cw);
    const isO = c => typeof c === 'object' && c !== null;
    const cellLines = (cell, k, bold) => this.wrap(isO(cell) ? cell.t : cell, ws[k] - 2 * pad, size, bold || (isO(cell) && !!cell.bold));
    const drawRow = (cells, header) => {
      const L = cells.map((c, k) => cellLines(c, k, header));
      const h = Math.max(...L.map(l => l.length)) * lh + 2 * pad;
      if (!header) this.ensure(h);
      let x = this.m;
      cells.forEach((c, k) => {
        const fill = header ? [235, 239, 247] : (isO(c) && c.fill) || null;
        this.rect(x, this.y, ws[k], h, { fill: fill || undefined, stroke: [190, 198, 212] });
        const al = cols[k].align || 'left';
        L[k].forEach((l, j) => {
          const tx = al === 'center' ? x + ws[k] / 2 : al === 'right' ? x + ws[k] - pad : x + pad;
          this.text(tx, this.y + pad + size + j * lh - 1, l, { size, bold: header || (isO(c) && !!c.bold), align: al, color: isO(c) ? c.color : undefined });
        });
        x += ws[k];
      });
      this.y += h;
    };
    const head = cols.map(c => c.label);
    const hH = Math.max(...head.map((c, k) => cellLines(c, k, true).length)) * lh + 2 * pad;
    this.ensure(hH + lh * 2 + 2 * pad); drawRow(head, true);
    rows.forEach(r => {
      const L = r.map((c, k) => cellLines(c, k));
      const h = Math.max(...L.map(l => l.length)) * lh + 2 * pad;
      if (this.y + h > this.H - this.m - 18) { this.addPage(); this.y = this.m; drawRow(head, true); }
      drawRow(r, false);
    });
    this.y += 8;
  }
  finish() {
    const n = this.pages.length;
    this.pages.forEach((p, i) => { this.cur = p; this.line(this.m, this.H - 30, this.W - this.m, this.H - 30, { color: [200, 200, 200] }); this.text(this.m, this.H - 18, this.footer, { size: 8, color: [110, 110, 110] }); this.text(this.W - this.m, this.H - 18, 'Seite ' + (i + 1) + ' / ' + n, { size: 8, align: 'right', color: [110, 110, 110] }); });
    return this.output();
  }
}

<script>

    pvoll:'Die Gruppe ist voll (höchstens 4 Personen).',pnicht:'Diese Person ist nicht in der Gruppe.',

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};

  sub(o){return new Q(this.n*o.d-o.n*this.d,this.d*o.d);}
  mul(o){return new Q(this.n*o.n,this.d*o.d);}
  div(o){return new Q(this.n*o.d,this.d*o.n);}

  eq(o){return this.n===o.n&&this.d===o.d;}

  isInt(){return this.d===1;}

}

  let d=q.d,k=0;while(d%2===0){d/=2;k++;}let m=0;while(d%5===0){d/=5;m++;}

  const p=Math.max(k,m),s=Math.abs(q.n)*Math.pow(10,p)/q.d,str=String(Math.round(s)).padStart(p+1,'0');

/* ---------- Eingabe normalisieren ---------- */
const SUPD={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};

/* ---------- Zahl-Antwort: ganze Zahl, Dezimalzahl, Bruch, gemischte Zahl ---------- */
function parseNumAns(s){

/* ---------- Term-Parser → Baum ---------- */
function tokenize(s){

    if(/[a-zA-Z]/.test(c)){out.push({k:'var',v:c.toLowerCase()});i++;continue;}
    if(SUPD[c]){let j=i,e='';while(j<s.length&&SUPD[s[j]]){e+=SUPD[s[j]];j++;}out.push({k:'sup',v:+e});i=j;continue;}

function parseTerm(str){

  }
  function term(){

  }
  function expAtom(){                       // Exponent: Zahl, Variable, (Term), auch negativ
    if(isOp(peek(),'-')){eat();return {t:'neg',node:expAtom()};}
    if(isOp(peek(),'(')){eat();const e=expr();if(!isOp(eat(),')'))throw new Error('Klammer');return {t:'grp',node:e};}
    const e=eat();if(!e)throw new Error('Exponent');
    if(e.k==='num'){const fp=(e.v.split('.')[1]||'');return {t:'num',q:new Q(Math.round(+e.v.replace('.','')),Math.pow(10,fp.length)),dec:fp.length>0};}

    if(t.k==='var')return {t:'var',v:t.v};
    if(isOp(t,'(')){const e=expr();if(!isOp(eat(),')'))throw new Error('Klammer');return {t:'grp',node:e};}

/* ---------- Polynome (auch negative Exponenten bei Division durch Monome) ---------- */
const mkey=m=>Object.keys(m).filter(v=>m[v]).sort().map(v=>v+m[v]).join(' ');
function P(map){this.m=map||{};}           // key → {c:Q, v:{x:2}}
P.c=q=>{const p=new P();if(!q.isZero())p.m['']={c:q,v:{}};return p;};
P.v=x=>{const p=new P();p.m[x+'1']={c:qi(1),v:{[x]:1}};return p;};

/* ---------- Ist ein Term vollständig vereinfacht? → Liste von Hinweisen (leer = ja) ---------- */
function simplifyIssues(n,allowNeg){
  const iss=new Set(),sigs={};
  const terms=n.t==='sum'?n.terms.map(t=>t.node):[n];
  terms.forEach(t=>{
    let node=t;if(node.t==='neg')node=node.node;
    const fs=node.t==='prod'?node.f:[{op:'*',node}];
    let nums=0;const vars={};
    fs.forEach((f,i)=>{const x=f.node;
      if(x.t==='num'){if(f.op==='/'){if(i===0||fs[i-1].node.t!=='num')nums++;}else nums++;}
      else if(x.t==='var'){if(f.op==='/'&&!allowNeg)iss.add('div');if(vars[x.v])iss.add('samevar');vars[x.v]=1;}
      else if(x.t==='pow'&&x.base.t==='var'){if(x.e===null)iss.add('grp');if((f.op==='/'||x.e<0)&&!allowNeg)iss.add('div');if(vars[x.base.v])iss.add('samevar');vars[x.base.v]=1;if(x.e===0||x.e===1)iss.add('exp');}
      else if(x.t==='pow'&&x.base.t==='num')iss.add('numpow');
      else if(x.t==='grp'&&x.node.t==='prod'&&x.node.f.length===2&&x.node.f.every(g=>g.node.t==='num')&&x.node.f[1].op==='/'&&f.op!=='/'){nums++;}   // (5/3)a erlaubt
      else if(x.t==='grp'||(x.t==='pow'&&x.base.t==='grp'))iss.add('grp');
      else if(x.t==='neg')iss.add('grp');
      else iss.add('grp');});
    if(nums>1)iss.add('nums');
    // Bruch als Vorzahl gekürzt?
    if(node.t==='prod'){for(let i=1;i<fs.length;i++)if(fs[i].op==='/'&&fs[i].node.t==='num'&&fs[i-1].node.t==='num'&&fs[i-1].op==='*'){const a=fs[i-1].node.q,b=fs[i].node.q;if(a.isInt()&&b.isInt()&&gcd(a.n,b.n)!==1)iss.add('kuerzen');}}

  });
  return [...iss];
}
const ISSUE_TXT={div:'Es steht noch eine Variable im Nenner oder ein Geteilt-Zeichen vor einer Variablen. Kürze.',

  exp:'Schreibe x¹ einfach als x (und x⁰ = 1).',numpow:'Rechne die Potenz der Zahl aus (z. B. 2³ = 8).',
  grp:'Löse alle Klammern auf.',nums:'Multipliziere die Zahlen in einem Produkt (z. B. 3 · 4a = 12a).',

/* ---------- Scheitelpunktform a(x + d)² + e ? ---------- */
function isVertexForm(n){
  const terms=n.t==='sum'?n.terms:[{sign:1,node:n}];
  let sq=0,cs=0,ok=true;
  terms.forEach(({node})=>{
    if(node.t==='num'){cs++;return;}
    if(node.t==='prod'&&node.f.every(f=>f.node.t==='num')){cs++;return;}
    const fs=node.t==='prod'?node.f:[{op:'*',node}];
    const pw=fs.filter(f=>f.node.t==='pow'&&f.node.base.t==='grp'&&f.node.e===2);
    const rest=fs.filter(f=>!(f.node.t==='pow'&&f.node.base.t==='grp'&&f.node.e===2));
    if(pw.length!==1||rest.some(f=>f.node.t!=='num')){ok=false;return;}
    try{const g=toPoly(pw[0].node.base.node);const ks=Object.keys(g.m);if(!ks.every(k=>k===''||k==='x1')||!g.m['x1']||!g.m['x1'].c.eq(qi(1)))ok=false;}catch(e){ok=false;}
    sq++;});
  return ok&&sq===1&&cs<=1;
}
/* ---------- Darstellung ---------- */
const fr=(z,n)=>`<span class="fr"><span>${z}</span><span>${n}</span></span>`;
function qHtml(q,mixed){

function makeRound(areaId,lvl,ops,n,seed,dim){

  for(let i=0;i<n;i++){
    let tk,op,tries=0;
    do{op=ar.ops?ops[i%ops.length]:null;tk=ar.g(lvl,op,dim);tries++;}while(seen.has(tk.html)&&tries<20);

  const fs=ast.t==='prod'?ast.f:[{op:'*',node:ast}];
  if(fs.some(f=>f.op==='/'))return ['form'];
  const grps=fs.filter(f=>f.node.t==='grp'),rest=fs.filter(f=>f.node.t!=='grp');
  if(grps.length!==1)return ['form'];

    const ts=p.terms();if(ts.length!==1)return ['form'];mons.push(ts[0]);}

  else{const gg=mons.map(m=>Math.abs(m.c.n)).reduce((a,b)=>gcd(a,b));if(gg>1)iss.push('num:'+gg);}

  return iss;
}

  if (inp && !inp._camHook) { inp._camHook = 1; const end = () => { CAM_UNTIL = Date.now() + 3000; }; inp.addEventListener('change', end); inp.addEventListener('cancel', end); }
}
const camActive = () => Date.now() < CAM_UNTIL;
(function () {
  const orig = HTMLInputElement.prototype.click;
  HTMLInputElement.prototype.click = function () { if (this.type === 'file') camOpen(this); return orig.apply(this, arguments); };
  const hit = e => { const t = e.target; if (!t || !t.closest) return; const i = t.closest('input[type=file]') || (t.closest('label') && t.closest('label').querySelector('input[type=file]')); if (i) camOpen(i); };
  document.addEventListener('pointerdown', hit, true); document.addEventListener('click', hit, true);
})();

   2) Runde: rechnen, auswerten, verbessern

let TASKS=null,TASKS_ID=null,TICK=null;
function tasks(){const c=state.cur;if(!TASKS||TASKS_ID!==c.id){TASKS=makeRound(c.area,c.lvl,c.ops,c.n,c.seed,c.dim);TASKS_ID=c.id;}return TASKS;}
const elapsed=c=>((c.end?new Date(c.end):new Date())-new Date(c.start))/1000;
/* Antwort prüfen → {ok, why (Tipp bei Fehler)} */
function check(tk,raw){
  raw=String(raw||'').trim();
  if(!raw)return {ok:false,why:'Keine Antwort.'};
  if(raw===NV){if(tk.form==='nv')return {ok:true};return {ok:false,why:'Hier <b>kann</b> man vereinfachen! '+tk.tip()};}
  if(tk.form==='nv')return {ok:false,why:'Diese Aufgabe lässt sich <b>nicht</b> vereinfachen – tippe auf <b>✋ geht nicht</b>. '+tk.tip()};
  if(tk.kind==='pf'){
    const fs=parseFactors(raw);if(!fs)return {ok:false,why:'Schreibe die Faktoren mit · dazwischen, z. B. 2^3 · 3 · 5. '+tk.tip()};
    const prod=fs.reduce((a,[b,e])=>a*Math.pow(b,e),1),np=[...new Set(fs.filter(([b])=>!isPrime(b)).map(([b])=>b))];
    if(prod!==tk.a)return {ok:false,why:`Das Produkt deiner Faktoren ist ${prod}, nicht ${tk.a}. `+(np.length?`Außerdem: ${np.join(', ')} ${np.length>1?'sind keine Primzahlen':'ist keine Primzahl'}. `:'')+tk.tip()};
    if(np.length)return {ok:false,why:`Richtig gerechnet – aber ${np.map(b=>b+' = '+fTxt(factorize(b))).join(', ')} ${np.length>1?'sind keine Primzahlen':'ist keine Primzahl'}. Zerlege weiter.`};
    return {ok:true};
  }
  if(tk.kind==='sym'){
    let ast;try{ast=parseTerm(raw);}catch(e){return {ok:false,why:'Das kann ich nicht lesen. Beispiel: 2^(n+1) oder 3^9.'};}
    if(!sameValue(ast,tk.a))return {ok:false,why:'Das ist nicht gleich dem Ausgangsterm. '+(/\^[\w.,]+\s*[-+*·]/.test(raw)?'<b>Achtung:</b> Ein Exponent mit mehreren Teilen braucht Klammern: 2^(n+1), nicht 2^n+1. ':'')+tk.tip()};
    const f=symFormIssue(ast,tk.form);if(f)return {ok:false,why:'Richtig gerechnet – aber: '+f};
    return {ok:true};
  }
  if(tk.kind==='fac'){
    let ast,p;try{ast=parseTerm(raw);p=toPoly(ast);}catch(e){return {ok:false,why:'Das ist kein gültiger Term. Beispiel: 4a^3(1 + 2a^2)'};}
    if(!p.eq(tk.a))return {ok:false,why:'Dein Term ist nicht gleich dem Ausgangsterm. <b>Probe:</b> Multipliziere wieder aus. '+tk.tip()};
    const iss=factorIssues(ast);
    if(iss.includes('form'))return {ok:false,why:'Schreibe das Ergebnis als Produkt: <b>gemeinsamer Faktor · ( … )</b>. '+tk.tip()};
    if(iss.length)return {ok:false,why:'Richtig – aber du kannst noch <b>mehr ausklammern</b>: '+iss.map(i=>i.startsWith('num:')?`Alle Zahlen in der Klammer sind noch durch ${i.slice(4)} teilbar.`:i.startsWith('var:')?`Alle Summanden in der Klammer enthalten noch ${prettyIn(i.slice(4))}.`:'In der Klammer sollen ganze Zahlen stehen.').join(' ')};
    return {ok:true};
  }
  if(tk.kind==='num'){
    const p=parseNumAns(raw);
    if(!p)return {ok:false,why:'Das ist keine gültige Zahl. Beispiele: 42 · 3,25 · 3/4 · 1 1/2'};
    if(p.q.eq(tk.a)){
      if(tk.want==='dec'&&p.form!=='dec'&&p.form!=='int')return {ok:false,why:'Richtig gerechnet – aber gib das Ergebnis als <b>Dezimalzahl</b> an.'};
      if(tk.want==='frac'){
        if(p.form==='dec')return {ok:false,why:'Richtig gerechnet – aber gib das Ergebnis als <b>Bruch</b> an.'};
        if(!p.reduced)return {ok:false,why:'Richtig gerechnet – aber noch <b>nicht vollständig gekürzt</b>.'};
        if(p.form==='mixed'&&!p.proper)return {ok:false,why:'Bei einer gemischten Zahl muss der Bruchteil kleiner als 1 sein.'};
      }
      return {ok:true};
    }
    return {ok:false,why:tk.tip(AREA_OF(tk)==='B'?p.q:p.q.val())};
  }
  let ast;
  try{ast=parseTerm(raw);}catch(e){return {ok:false,why:'Das ist kein gültiger Term. Beispiel: 3x^2 - 2xy + 5 (Potenz mit ^, mal mit * oder ohne Zeichen).'};}
  let p;try{p=toPoly(ast);}catch(e){return {ok:false,why:'Diesen Term kann ich nicht lesen. Prüfe Klammern und Geteilt-Zeichen.'};}
  if(tk.kind==='qe'){
    if(!p.eq(tk.a))return {ok:false,why:'Dein Term ist nicht gleich dem Ausgangsterm. <b>Probe:</b> Multipliziere deine Lösung aus. '+tk.tip()};
    if(!isVertexForm(ast))return {ok:false,why:'Richtig umgeformt – aber noch nicht in der Form <b>a(x + d)² + e</b>. '+tk.tip()};
    return {ok:true};
  }
  if(!p.eq(tk.a)){
    const ka=Object.keys(tk.a.m),ks=Object.keys(p.m);let d='';
    if(ka.length===ks.length&&ka.every(k=>p.m[k]))d='Die Variablen und Exponenten stimmen. Prüfe die <b>Zahlen und Vorzeichen</b>.';
    else if(ks.some(k=>!tk.a.m[k]))d='In deinem Ergebnis stehen Terme, die so nicht vorkommen. Prüfe die <b>Exponenten</b> und Variablen.';
    else d='Es fehlt etwas. Hast du <b>jeden Summanden</b> berücksichtigt?';
    return {ok:false,why:d+' '+tk.tip()};
  }
  const iss=simplifyIssues(ast,tk.allowNeg);
  if(iss.length)return {ok:false,why:'Richtig umgeformt – aber noch nicht ganz vereinfacht. '+iss.map(i=>ISSUE_TXT[i]).join(' ')};
  return {ok:true};
}

  else{const b=el('button','btn green big','🔁 Neue Runde (gleiche Einstellungen)');b.onclick=()=>{endRound();startRoundSame();};btns.appendChild(b);

  const KAT={z:'Zahlen und Rechenarten',p:'Prozentrechnung',b:'Brüche und Dezimalzahlen',t:'Terme und Gleichungen',w:'Potenzen, Wurzeln, Teilbarkeit',o:'Arbeitsaufträge (Operatoren)'};
  const BY={};W.forEach(w=>BY[w[0]]=w);
  const FORM={};W.forEach(w=>w[6].split('|').forEach(f=>FORM[f.toLowerCase()]=w[0]));

  const alts=Object.keys(FORM).sort((a,b)=>b.length-a.length).map(f=>f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');

  /* ---------- Wörter auf der Seite unterstreichen ---------- */
  function scan(root){
    root=root||document.querySelector('main');if(!root)return;
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){

      const t=n.nodeValue,frag=document.createDocumentFragment(),set=seenSet(scopeOf(n));let last=0,m,any=false;RE.lastIndex=0;
      while((m=RE.exec(t))){const st=m.index+m[1].length,id=FORM[m[2].toLowerCase()];

  let pend=false;

  /* ---------- Übersetzung anzeigen ---------- */
  let pop=null;
  function closePop(){if(pop){pop.remove();pop=null;}}

    pop.innerHTML=`<div class="dp-de">${art(w)}<b>${w[1]}</b>${w[3]?` <span class="dp-pl">· Plural: ${w[3]}</span>`:''}</div>
      <div class="dp-en">🇬🇧 ${w[4]}</div>${w[7]?`<div class="dp-x">${w[7]}</div>`:''}

    h+=`<div class="w-chips"><button class="wchip${kat?'':' on'}" data-k="">Alle</button>${Object.keys(KAT).map(k=>`<button class="wchip${kat===k?' on':''}" data-k="${k}">${KAT[k]}</button>`).join('')}</div>`;

      h+=`<div class="card"><h3>${KAT[k]}</h3><div class="wlist">`+W.filter(w=>w[5]===k).map(w=>

  /* ---------- Wörter-Test ---------- */
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

      box.innerHTML=`<div class="card tcard"><h3>🎯 Ergebnis</h3><div class="tq-big">${T.ok} von ${T.qs.length} richtig ${T.ok>=9?'🏆':T.ok>=7?'🎉':'💪'}</div>
        ${T.wrong.length?`<p>Diese Wörter üben wir noch:</p><div class="wlist">${T.wrong.map(w=>`<div class="witem"><button class="wsay" data-say="${w[0]}">🔊</button><div class="wde">${art(w)}<b>${w[1]}</b></div><div class="wen">${w[4]}</div><div></div></div>`).join('')}</div>`:'<p>Super – alles richtig!</p>'}
        <p class="w-note">✅ Sicher: ${nSicher()} von ${W.length} Wörtern</p>
        <div class="row"><button class="btn yellow" id="tAgain">🔁 Neuer Test</button><button class="btn sec" id="tBack">📖 Zur Wortliste</button></div></div>`;
      box.querySelector('#tAgain').onclick=start;box.querySelector('#tBack').onclick=()=>{test=null;render();};

      else{s.known[Q.w[0]]=0;T.wrong.push(Q.w);b.classList.add('wrong');btns.forEach(x=>{if(Q.opts[+x.dataset.k]===Q.c)x.classList.add('right');});

    summary:()=>{const s=d();return `sicher ${nSicher()}/${W.length} · Tests ${s.tests||0}`+(s.tests?` · bester ${s.best||0}/10`:'');}};
})();
DFU.init();
</script>
